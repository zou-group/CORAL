[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "CORAL"
version = "0.0.1"
description = "spatial multiomics integrative toolbox."
readme = "README.md"
license = {file="LICENSE"}
authors = [{name = "Siyu He", email = "siyuhe@stanford.edu"}]
requires-python = ">= 3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "networkx>=3.0",
  "anndata>=0.10",
  "scanpy>=1.10",
  "igraph>=0.10",
  "umap-learn>=0.5",
  "torch>=2.0",
  "torch-geometric>=2.4",
]

[project.optional-dependencies]
docs = [
  "sphinx>=7.0",
  "furo",
  "nbsphinx",
  "ipykernel",
  "sphinx-copybutton",
]

[project.urls]
Homepage = "https://github.com/zou-group/CORAL"
Documentation = "https://coral-omics.readthedocs.io"
Repository = "https://github.com/zou-group/CORAL"

[tool.setuptools.packages.find]
include = ["coral*"]
